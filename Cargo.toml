[package]
name = "ruie-studio"
version = "0.1.0"
edition = "2024"
publish = false
description = "A native Hacker News inbox for reviewing and triaging new posts."

[features]
visual-check = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = { path = "../gpui-kit/crates/kit" }
anyhow = "1"
futures = "0.3"
futures-timer = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.10" }
html-escape = "0.2"
url = "2"
wry = "0.57.1"

[dev-dependencies]
gpui-kit = { path = "../gpui-kit/crates/kit", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.dev]
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

